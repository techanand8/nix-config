<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="100%">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes fade-in-out {
      0%, 5% { opacity: 0; transform: translateY(10px); }
      15%, 85% { opacity: 1; transform: translateY(0); }
      95%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    .text {
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 16px;
      fill: #39ff14;
      text-anchor: middle;
      opacity: 0;
      filter: url(#glow);
    }
    .highlight {
      fill: #ff1133;
      font-weight: bold;
    }
    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
      fill: rgba(255, 255, 255, 0.4);
      text-anchor: middle;
    }
  </style>

  <rect width="800" height="150" fill="#050107" rx="8" />
  
  <text x="400" y="30" class="title">WORKSTATION ACKNOWLEDGMENTS</text>

  <g transform="translate(400, 85)">
    <text class="text" style="animation: fade-in-out 10s infinite 0s;">
      Deep gratitude to <tspan class="highlight">ILLOGICAL IMPULSE</tspan> for the Omarchy security layer
    </text>
    <text class="text" style="animation: fade-in-out 10s infinite 2.5s;">
      Aesthetic frameworks and Hyprland logic powered by <tspan class="highlight">AMBXST PROJECT</tspan>
    </text>
    <text class="text" style="animation: fade-in-out 10s infinite 5s;">
      Structural and declarative inspiration sourced from <tspan class="highlight">ZANEYOS</tspan>
    </text>
    <text class="text" style="animation: fade-in-out 10s infinite 7.5s;">
      Innovation driven by the global <tspan class="highlight">OPEN SOURCE VLSI</tspan> community
    </text>
  </g>
  
  <path d="M 50,130 L 750,130" stroke="#39ff14" stroke-width="0.5" stroke-dasharray="4, 10" opacity="0.3" />
</svg>
