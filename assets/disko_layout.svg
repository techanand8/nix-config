<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e14" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>
    
    <!-- Component Gradients -->
    <linearGradient id="esp-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="sys-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#39ff14" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="swap-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff1133" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ff1133" stop-opacity="0.05" />
    </linearGradient>
    <linearGradient id="subvol-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#39ff14" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&amp;family=Outfit:wght@300;400;600;700&amp;display=swap');
    
    .title-text { font-family: 'Outfit', sans-serif; font-size: 20px; fill: #ffffff; font-weight: 700; letter-spacing: 2px; }
    .mono-text { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #8892b0; font-weight: 400; }
    .mono-bold { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #ffffff; font-weight: 700; }
    .header-text { font-family: 'Outfit', sans-serif; font-size: 13px; fill: #ffffff; font-weight: 600; }
    .desc-text { font-family: 'Outfit', sans-serif; font-size: 11px; fill: #8892b0; font-weight: 400; }

    .glow-path { stroke-dasharray: 8 8; animation: dash 35s linear infinite; }
    @keyframes dash {
      to { stroke-dashoffset: -1000; }
    }

    .interactive-card {
      cursor: pointer;
    }
    .interactive-card:hover {
      filter: brightness(1.2);
    }
    
    .pulse {
      animation: pulse-anim 2s infinite;
    }
    @keyframes pulse-anim {
      0% { r: 4; opacity: 1; }
      100% { r: 12; opacity: 0; }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" stroke="#1f2937" stroke-width="1.5" />

  <!-- Outer HUD Grid Lines (Subtle Silicon Vibe) -->
  <path d="M 40 0 L 40 480 M 920 0 L 920 480 M 0 60 L 960 60 M 0 420 L 960 420" stroke="#1f2937" stroke-width="0.5" stroke-opacity="0.5" />

  <!-- Title/Header Block -->
  <g transform="translate(60, 40)">
    <text class="title-text" y="0">💿 DECLARATIVE STORAGE ARCHITECTURE</text>
    <text class="mono-text" y="16" fill="#00f5ff">&lt;dev/nvme0n1&gt; • Btrfs-on-LUKS Stateless Rollback Layout</text>
    
    <!-- State badge -->
    <g transform="translate(710, -12)">
      <rect width="130" height="24" rx="12" fill="#0c1d1a" stroke="#134e4a" stroke-width="1" />
      <circle cx="20" cy="12" r="4" fill="#39ff14" />
      <circle class="pulse" cx="20" cy="12" r="4" fill="none" stroke="#39ff14" stroke-width="1.5" />
      <text class="mono-bold" x="34" y="16" font-size="10" fill="#39ff14">TPM2 SECURED</text>
    </g>
  </g>

  <!-- ==================== PARTITION BAR VIEW ==================== -->
  <g transform="translate(60, 100)">
    <!-- Main Disk Border -->
    <rect width="840" height="60" rx="8" fill="#0e131f" stroke="#1f2937" stroke-width="2" />
    
    <!-- 1. ESP Boot Partition Card (Width: 96px) -->
    <g class="interactive-card" transform="translate(4, 4)">
      <rect width="96" height="52" rx="6" fill="url(#esp-grad)" stroke="#00f5ff" stroke-width="1.5" filter="url(#glow-cyan)" />
      <text class="header-text" x="12" y="24" fill="#00f5ff">ESP</text>
      <text class="mono-text" x="12" y="38" font-size="9" fill="#e2e8f0">1G • vfat</text>
    </g>

    <!-- 2. System LUKS Partition Card (Width: 616px) -->
    <g class="interactive-card" transform="translate(104, 4)">
      <rect width="616" height="52" rx="6" fill="url(#sys-grad)" stroke="#39ff14" stroke-width="1.5" filter="url(#glow-green)" />
      <text class="header-text" x="16" y="24" fill="#39ff14">system (LUKS encrypted)</text>
      <text class="mono-text" x="16" y="38" font-size="9" fill="#e2e8f0">459G • Btrfs pool &lt;cryptsystem&gt;</text>
    </g>

    <!-- 3. Swap LUKS Partition Card (Width: 112px) -->
    <g class="interactive-card" transform="translate(724, 4)">
      <rect width="112" height="52" rx="6" fill="url(#swap-grad)" stroke="#ff1133" stroke-width="1.5" filter="url(#glow-red)" />
      <text class="header-text" x="12" y="24" fill="#ff1133">swap</text>
      <text class="mono-text" x="12" y="38" font-size="9" fill="#e2e8f0">~16G • LUKS</text>
    </g>
  </g>

  <!-- ==================== FLOW & MAPPING LINES (FLAWLESSLY ALIGNED) ==================== -->
  <g fill="none" stroke-width="1.5">
    <!-- ESP mapping flow (to Col 1 Center at 135) -->
    <path d="M 112 164 V 200 C 112 220, 135 210, 135 230 V 250" stroke="#00f5ff" stroke-opacity="0.4" />
    <circle cx="112" cy="164" r="3" fill="#00f5ff" />

    <!-- system mapping flow (from 516, 164) -->
    <circle cx="516" cy="164" r="3.5" fill="#39ff14" />
    
    <!-- Subvolume Split Paths to Col 2 (305), Col 3 (475), Col 4 (645) -->
    <path class="glow-path" d="M 516 164 V 190 C 516 220, 305 210, 305 230 V 250" stroke="url(#subvol-grad)" />
    <path class="glow-path" d="M 516 164 V 190 C 516 220, 475 210, 475 230 V 250" stroke="url(#subvol-grad)" />
    <path class="glow-path" d="M 516 164 V 190 C 516 220, 645 210, 645 230 V 250" stroke="url(#subvol-grad)" />

    <!-- swap mapping flow (to Col 5 Center at 815) -->
    <path d="M 840 164 V 200 C 840 220, 815 210, 815 230 V 250" stroke="#ff1133" stroke-opacity="0.4" />
    <circle cx="840" cy="164" r="3" fill="#ff1133" />
  </g>

  <!-- ==================== DETAILS & SUBVOLUMES (5 METRIC COLUMNS) ==================== -->
  
  <!-- Column 1: /boot details -->
  <g class="interactive-card" transform="translate(60, 250)">
    <rect width="150" height="145" rx="6" fill="#0e131f" stroke="#00f5ff" stroke-width="1.2" stroke-opacity="0.8" />
    <text class="mono-bold" x="12" y="22" fill="#00f5ff">/boot</text>
    <text class="desc-text" x="12" y="42" fill="#e2e8f0">EFI System Partition</text>
    <text class="mono-text" x="12" y="62">• vfat filesystem</text>
    <text class="mono-text" x="12" y="76">• Size: 1.0 GB</text>
    <text class="mono-text" x="12" y="90">• ID: disk-main-ESP</text>
    <text class="mono-text" x="12" y="104" font-size="8.5" fill="#8892b0">Options:</text>
    <text class="mono-text" x="12" y="116" font-size="8.5" fill="#00f5ff">fmask=0077,dmask=0077</text>
  </g>

  <!-- Column 2: / (root) details -->
  <g class="interactive-card" transform="translate(230, 250)">
    <rect width="150" height="145" rx="6" fill="#0b1311" stroke="#39ff14" stroke-width="1.2" stroke-opacity="0.8" />
    <text class="mono-bold" x="12" y="22" fill="#39ff14">/ (root)</text>
    <text class="desc-text" x="12" y="42" fill="#e2e8f0">Stateless Root Pool</text>
    
    <!-- Stateless Badge -->
    <g transform="translate(12, 50)">
      <rect width="68" height="14" rx="3" fill="#521217" />
      <text class="mono-bold" x="6" y="11" font-size="8" fill="#f87171">STATELESS</text>
    </g>
    
    <text class="mono-text" x="12" y="78">• Wiped on reboot</text>
    <text class="mono-text" x="12" y="92">• subvol=root</text>
    <text class="mono-text" x="12" y="106" font-size="8.5" fill="#8892b0">Auxiliary Subvolumes:</text>
    <text class="mono-text" x="12" y="118" font-size="8.5" fill="#39ff14">/nix, /srv, /var/tmp</text>
    <text class="mono-text" x="12" y="130" font-size="8.5" fill="#8892b0">compress=zstd:3</text>
  </g>

  <!-- Column 3: /home details -->
  <g class="interactive-card" transform="translate(400, 250)">
    <rect width="150" height="145" rx="6" fill="#0c121a" stroke="#39ff14" stroke-width="1.2" stroke-opacity="0.5" />
    <text class="mono-bold" x="12" y="22" fill="#ffffff">/home</text>
    <text class="desc-text" x="12" y="42" fill="#e2e8f0">Persistent User Data</text>
    
    <!-- State Badge -->
    <g transform="translate(12, 50)">
      <rect width="72" height="14" rx="3" fill="#0f2d1e" />
      <text class="mono-bold" x="6" y="11" font-size="8" fill="#34d399">PERSISTENT</text>
    </g>
    
    <text class="mono-text" x="12" y="78">• subvol=home</text>
    <text class="mono-text" x="12" y="92">• neededForBoot = true</text>
    <text class="mono-text" x="12" y="106">• noatime, ssd</text>
    <text class="mono-text" x="12" y="120" font-size="8.5" fill="#8892b0">Flags:</text>
    <text class="mono-text" x="12" y="132" font-size="8.5" fill="#00f5ff">space_cache=v2</text>
  </g>

  <!-- Column 4: /persist details -->
  <g class="interactive-card" transform="translate(570, 250)">
    <rect width="150" height="145" rx="6" fill="#0c121a" stroke="#39ff14" stroke-width="1.2" stroke-opacity="0.5" />
    <text class="mono-bold" x="12" y="22" fill="#ffffff">/persist</text>
    <text class="desc-text" x="12" y="42" fill="#e2e8f0">Persistent System State</text>
    
    <!-- State Badge -->
    <g transform="translate(12, 50)">
      <rect width="72" height="14" rx="3" fill="#0f2d1e" />
      <text class="mono-bold" x="6" y="11" font-size="8" fill="#34d399">PERSISTENT</text>
    </g>
    
    <text class="mono-text" x="12" y="78">• subvol=persist</text>
    <text class="mono-text" x="12" y="92">• machine-id mapping</text>
    <text class="mono-text" x="12" y="106">• keys, SSH, VPNs</text>
    <text class="mono-text" x="12" y="120" font-size="8.5" fill="#8892b0">Security:</text>
    <text class="mono-text" x="12" y="132" font-size="8.5" fill="#39ff14">sops-nix integration</text>
  </g>

  <!-- Column 5: [SWAP] details -->
  <g class="interactive-card" transform="translate(740, 250)">
    <rect width="150" height="145" rx="6" fill="#1b080b" stroke="#ff1133" stroke-width="1.2" stroke-opacity="0.8" />
    <text class="mono-bold" x="12" y="22" fill="#ff1133">[SWAP]</text>
    <text class="desc-text" x="12" y="42" fill="#e2e8f0">System Swap Device</text>
    <text class="mono-text" x="12" y="62">• cryptswap device</text>
    <text class="mono-text" x="12" y="76">• Size: ~16.0 GB</text>
    <text class="mono-text" x="12" y="90">• ID: disk-main-swap</text>
    <text class="mono-text" x="12" y="104" font-size="8.5" fill="#8892b0">Advanced Rules:</text>
    <text class="mono-text" x="12" y="116" font-size="8.5" fill="#ff1133">resumeDevice = true</text>
    <text class="mono-text" x="12" y="128" font-size="8.5" fill="#ff1133">tpm2-device=auto</text>
  </g>

  <!-- Footer Telemetry Line -->
  <g transform="translate(60, 440)">
    <text class="mono-text" x="0" y="0">MANX STORAGE ENGINE V3.0 • OPTIMIZED BTRFS STACK</text>
    <text class="mono-text" x="840" y="0" text-anchor="end" fill="#39ff14">SYMMETRIC HARDWARE BLUEPRINT COMPLETE</text>
  </g>
</svg>
