# This file houses private variables (e.g. passwords, SSH private keys, API tokens)
# that you want to keep encrypted within your public Git repository.
#
# INSTRUCTIONS FOR INITIAL ENCRYPTION:
# ------------------------------------
# 1. Convert your host's SSH key into an Age public key (or generate a standard age key).
#    To find your system's public age key derived from your host SSH key, run:
#    $ nix-shell -p ssh-to-age --run "ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub"
#
# 2. Add your public age key to the `.sops.yaml` configuration in your root directory
#    (or configure it dynamically).
#
# 3. Encrypt this file by running:
#    $ sops --encrypt --in-place secrets/secrets.yaml
#
# 4. To edit this file securely in the future, run:
#    $ sops secrets/secrets.yaml
# =========================================================================

